name: Ecosystem radar
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Full discovery or metadata refresh
        type: choice
        options: [full, metadata-only]
        default: full
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ecosystem-radar
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Discover projects and refresh metadata
        run: |
          if [ "$RADAR_MODE" = "metadata-only" ]; then
            npm run radar -- --metadata-only
          else
            npm run radar
          fi
        env:
          RADAR_MODE: ${{ inputs.mode || 'full' }}
          GITHUB_TOKEN: ${{ secrets.RADAR_GITHUB_TOKEN || github.token }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          RADAR_MAX_PAGES: "2"
          RADAR_MAX_CANDIDATES: "60"
      - name: Validate data and frontend
        run: npm test && npm run build
      - name: Publish data snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/projects.json src/data/radar.json radar/receipts radar/state.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Jev ecosystem radar"
            git -c credential.helper='!gh auth git-credential' push
          fi
      - name: Retain scan receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-receipts
          path: radar/receipts
          retention-days: 30
