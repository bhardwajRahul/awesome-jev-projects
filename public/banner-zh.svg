<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <radialGradient id="glow-emerald" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-blue" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="880" height="240" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="880" height="240" rx="16" fill="url(#glow-emerald)" />
  <rect width="880" height="240" rx="16" fill="url(#glow-blue)" />

  <!-- Subtle Grid Dots Pattern -->
  <g opacity="0.12" fill="#94a3b8">
    <circle cx="40" cy="40" r="1.5" /><circle cx="80" cy="40" r="1.5" /><circle cx="120" cy="40" r="1.5" /><circle cx="160" cy="40" r="1.5" />
    <circle cx="40" cy="80" r="1.5" /><circle cx="80" cy="80" r="1.5" /><circle cx="120" cy="80" r="1.5" /><circle cx="160" cy="80" r="1.5" />
    <circle cx="40" cy="120" r="1.5" /><circle cx="80" cy="120" r="1.5" /><circle cx="120" cy="120" r="1.5" /><circle cx="160" cy="120" r="1.5" />
    <circle cx="720" cy="120" r="1.5" /><circle cx="760" cy="120" r="1.5" /><circle cx="800" cy="120" r="1.5" /><circle cx="840" cy="120" r="1.5" />
    <circle cx="720" cy="160" r="1.5" /><circle cx="760" cy="160" r="1.5" /><circle cx="800" cy="160" r="1.5" /><circle cx="840" cy="160" r="1.5" />
    <circle cx="720" cy="200" r="1.5" /><circle cx="760" cy="200" r="1.5" /><circle cx="800" cy="200" r="1.5" /><circle cx="840" cy="200" r="1.5" />
  </g>

  <!-- Top Pill -->
  <g transform="translate(48, 32)">
    <rect width="206" height="26" rx="13" fill="#064e3b" fill-opacity="0.5" stroke="#059669" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#34d399" />
    <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" fill="#a7f3d0" letter-spacing="0.5">TYPESAFE AI · JEV 开源生态雷达</text>
  </g>

  <!-- Live Counter Pill -->
  <g transform="translate(680, 32)">
    <rect width="152" height="26" rx="13" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="14" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="500" fill="#94a3b8">169+ 真实项目已核验</text>
    <circle cx="136" cy="13" r="3" fill="#10b981" />
  </g>

  <!-- Title & Icon -->
  <g transform="translate(48, 102)">
    <!-- Electric Icon Shield -->
    <rect x="0" y="-30" width="46" height="46" rx="12" fill="#047857" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
    <path d="M23 -22 L14 -9 L22 -9 L20 4 L31 -6 L23 -6 Z" fill="#34d399" filter="url(#shadow)" />
    
    <text x="60" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="34" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.8">Awesome Jev Projects</text>
  </g>

  <!-- Subtitle -->
  <text x="48" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="400" fill="#94a3b8" letter-spacing="-0.2">
    严谨收录 169+ 个由 TypeSafe Jev 驱动的真实开源应用、工程工具与高频决策引擎。
  </text>

  <!-- Bottom Badges / Tags -->
  <g transform="translate(48, 178)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect width="130" height="26" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
      <text x="10" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="500" fill="#cbd5e1">⚡ 毫秒级极速决策</text>
    </g>

    <!-- Badge 2 -->
    <g transform="translate(140, 0)">
      <rect width="124" height="26" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
      <text x="10" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="500" fill="#cbd5e1">🎯 三大底层算子</text>
    </g>

    <!-- Badge 3 -->
    <g transform="translate(274, 0)">
      <rect width="126" height="26" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
      <text x="10" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="500" fill="#cbd5e1">🔍 100% 源码佐证</text>
    </g>

    <!-- Badge 4 -->
    <g transform="translate(410, 0)">
      <rect width="120" height="26" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
      <text x="10" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="500" fill="#cbd5e1">🛡️ 拒绝概念炒作</text>
    </g>

    <!-- Badge 5 -->
    <g transform="translate(540, 0)">
      <rect width="126" height="26" rx="6" fill="#047857" fill-opacity="0.3" stroke="#059669" stroke-width="1" />
      <text x="10" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" fill="#34d399">🌐 四国语言生态</text>
    </g>
  </g>
</svg>
